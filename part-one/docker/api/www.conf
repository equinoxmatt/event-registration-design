[www]
user = www-data
group = www-data

; TCP socket — listen address set by the official image's zz-docker.conf
; This pool config adds process management tuning and health endpoints on top.

pm = dynamic
pm.max_children = 50
pm.start_servers = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 35
pm.max_requests = 500

; Used by the container healthcheck:
;   SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET \
;   cgi-fcgi -bind -connect 127.0.0.1:9000
ping.path = /ping
ping.response = pong

pm.status_path = /status
